name: Sync Asset Database from OneDrive Share Link

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl

      - name: Download source Excel from OneDrive public share link
        env:
          SHARED_URL: 'https://1drv.ms/x/c/8dd2c5d0a467a39a/IQCp0TJlLQVoTbgVteIwn2fFAbSYv35ABYxVGW3GDX5d61c?e=ihMHpP'
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          shared_url = os.environ['SHARED_URL']
          output = 'Input RBI.xlsx'

          # New OneDrive Personal share links (1drv.ms/x/c/...) can return
          # 401 when the old /shares/{encoded}/root/content endpoint is used.
          # Resolve the public share with Microsoft's current Badger mechanism,
          # obtain the temporary content.downloadUrl, then download the XLSX.
          APP_ID = '5cbed6ac-a083-4e14-b191-b4ba07653de2'
          token_req = urllib.request.Request(
              'https://api-badgerp.svc.ms/v1.0/token',
              data=json.dumps({'appId': APP_ID}).encode(),
              headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'},
              method='POST',
          )
          with urllib.request.urlopen(token_req, timeout=30) as r:
              token_data = json.load(r)
          badger = token_data.get('token')
          if not badger:
              raise RuntimeError('Failed to obtain Microsoft Badger token.')

          encoded = base64.urlsafe_b64encode(shared_url.encode()).decode().rstrip('=')
          share_api = (
              'https://my.microsoftpersonalcontent.com/_api/v2.0/shares/u!'
              + encoded
              + '/driveitem?$select=id,name,size,file,parentReference,@content.downloadUrl'
          )

          share_req = urllib.request.Request(
              share_api,
              headers={
                  'Authorization': f'Badger {badger}',
                  'Prefer': 'autoredeem',
                  'Accept': 'application/json',
                  'User-Agent': 'Mozilla/5.0',
              },
          )
          with urllib.request.urlopen(share_req, timeout=30) as r:
              item = json.load(r)

          download_url = item.get('@content.downloadUrl')
          if not download_url:
              raise RuntimeError(
                  'OneDrive did not return @content.downloadUrl. Response keys: '
                  + ', '.join(item.keys())
              )

          download_req = urllib.request.Request(
              download_url,
              headers={'User-Agent': 'Mozilla/5.0'},
          )
          with urllib.request.urlopen(download_req, timeout=120) as r, open(output, 'wb') as f:
              while True:
                  chunk = r.read(1024 * 1024)
                  if not chunk:
                      break
                  f.write(chunk)

          size = os.path.getsize(output)
          if size < 1000:
              raise RuntimeError(f'Downloaded file is unexpectedly small: {size} bytes')

          # XLSX is a ZIP container. Check the magic bytes before handing it to openpyxl.
          with open(output, 'rb') as f:
              magic = f.read(4)
          if magic != b'PK\x03\x04':
              raise RuntimeError(f'Downloaded file is not an XLSX/ZIP file. Magic={magic!r}')

          print(f'Downloaded: {item.get("name", output)} ({size:,} bytes)')
          print(f'Output: {output}')
          PY
          ls -lh 'Input RBI.xlsx'

      - name: Generate Static Equipment database
        run: python sync_database.py

      - name: Commit updated database
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Sync Static Equipment database from OneDrive share link"
            git push
          fi
