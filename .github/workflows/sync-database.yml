name: Sync Static Equipment Database

on:
  workflow_dispatch:
  push:
    paths:
      - 'Database_Asset_Static_Equipment.xlsx'
      - 'sync_database.py'
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install openpyxl

      - name: Generate dashboard database
        run: python sync_database.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Sync static equipment database"
            git push
          fi
