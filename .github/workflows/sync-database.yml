name: Sync Asset Database from OneDrive Share Link

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl

      - name: Download source Excel from OneDrive share link
        run: |
          set -euo pipefail
          SHARED_URL='https://1drv.ms/x/c/8dd2c5d0a467a39a/IQCp0TJlLQVoTbgVteIwn2fFAbSYv35ABYxVGW3GDX5d61c?e=Nfh29j'
          SHARING_TOKEN=$(python -c 'import base64,sys; print(base64.urlsafe_b64encode(sys.argv[1].encode()).decode().rstrip("="))' "$SHARED_URL")
          DOWNLOAD_URL="https://api.onedrive.com/v1.0/shares/u!${SHARING_TOKEN}/root/content"
          HTTP_CODE=$(curl -sS -L -o 'Input RBI.xlsx' -w '%{http_code}' --retry 3 "$DOWNLOAD_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "OneDrive share-link download failed (HTTP $HTTP_CODE)."
            head -c 1000 'Input RBI.xlsx' || true
            exit 1
          fi
          test -s 'Input RBI.xlsx' || { echo "Downloaded Excel is empty."; exit 1; }
          file 'Input RBI.xlsx'
          ls -lh 'Input RBI.xlsx'

      - name: Generate Static Equipment database
        run: python sync_database.py

      - name: Commit updated database
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Sync Static Equipment database from OneDrive share link"
            git push
          fi
