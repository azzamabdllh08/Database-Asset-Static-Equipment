name: Sync Asset Database from OneDrive Share Link

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-database.yml'
      - 'sync_database.py'
      - 'tools/sync_static.py'
  schedule:
    # Every 3 hours. GitHub Actions cron is UTC.
    - cron: '5 0,3,6,9,12,15,18,21 * * *'

permissions:
  contents: write

env:
  TZ: Asia/Jakarta

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl

      - name: Download source Excel from OneDrive public share link
        env:
          SHARED_URL: 'https://1drv.ms/x/c/8dd2c5d0a467a39a/IQCp0TJlLQVoTbgVteIwn2fFAbSYv35ABYxVGW3GDX5d61c?e=aS7rws'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "OneDrive download attempt ${attempt}/3"
            if python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          shared_url = os.environ['SHARED_URL']
          output = 'Input RBI.xlsx'
          APP_ID = '5cbed6ac-a083-4e14-b191-b4ba07653de2'
          token_req = urllib.request.Request(
              'https://api-badgerp.svc.ms/v1.0/token',
              data=json.dumps({'appId': APP_ID}).encode(),
              headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'},
              method='POST',
          )
          with urllib.request.urlopen(token_req, timeout=30) as r:
              token_data = json.load(r)
          badger = token_data.get('token')
          if not badger:
              raise RuntimeError('Failed to obtain Microsoft Badger token.')
          encoded = base64.urlsafe_b64encode(shared_url.encode()).decode().rstrip('=')
          share_api = ('https://my.microsoftpersonalcontent.com/_api/v2.0/shares/u!' + encoded + '/driveitem?$select=id,name,size,file,parentReference,@content.downloadUrl')
          share_req = urllib.request.Request(
              share_api,
              headers={'Authorization': f'Badger {badger}', 'Prefer': 'autoredeem', 'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0'},
          )
          with urllib.request.urlopen(share_req, timeout=30) as r:
              item = json.load(r)
          download_url = item.get('@content.downloadUrl')
          if not download_url:
              raise RuntimeError('OneDrive did not return @content.downloadUrl.')
          download_req = urllib.request.Request(download_url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(download_req, timeout=120) as r, open(output, 'wb') as f:
              while True:
                  chunk = r.read(1024 * 1024)
                  if not chunk:
                      break
                  f.write(chunk)
          size = os.path.getsize(output)
          if size < 1000:
              raise RuntimeError(f'Downloaded file is unexpectedly small: {size} bytes')
          with open(output, 'rb') as f:
              if f.read(4) != b'PK\\x03\\x04':
                  raise RuntimeError('Downloaded file is not an XLSX/ZIP file.')
          print(f'Downloaded: {item.get("name", output)} ({size:,} bytes)')
          PY
            then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 20
          done
          ls -lh 'Input RBI.xlsx'

      - name: Generate Static Equipment database
        run: python sync_database.py

      - name: Normalize manifest timestamp as UTC
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path('data/manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          raw = str(data.get('generatedAt', '')).strip()
          if raw:
              dt = datetime.fromisoformat(raw.replace('Z', '+00:00'))
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              data['generatedAt'] = dt.astimezone(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('generatedAt:', data.get('generatedAt'))
          PY

      - name: Write sync heartbeat
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          Path('data/sync-heartbeat.txt').write_text(
              datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z') + '\n',
              encoding='utf-8'
          )
          PY

      - name: Commit updated database
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data/manifest.json data/regions/*.json data/inspections.json data/sync-heartbeat.txt
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Sync Static Equipment database from OneDrive share link"
            git push
          fi
