name: Sync Asset Database from OneDrive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl

      - name: Get Microsoft Graph token
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLIENT_ID" || { echo "Missing AZURE_CLIENT_ID"; exit 1; }
          test -n "$TENANT_ID" || { echo "Missing AZURE_TENANT_ID"; exit 1; }
          test -n "$CLIENT_SECRET" || { echo "Missing AZURE_CLIENT_SECRET"; exit 1; }

          RESPONSE=$(curl -fsS -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<< "$RESPONSE")
          test -n "$TOKEN" || { echo "Microsoft Graph token was not returned."; exit 1; }
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Get OneDrive drive ID
        env:
          USER_ID: ${{ secrets.AZURE_ONEDRIVE_USER_ID }}
        run: |
          set -euo pipefail
          test -n "$USER_ID" || { echo "Missing AZURE_ONEDRIVE_USER_ID secret"; exit 1; }
          RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/${USER_ID}/drive")
          DRIVE_ID=$(python -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))' <<< "$RESPONSE")
          test -n "$DRIVE_ID" || { echo "Drive ID was not found."; exit 1; }
          echo "DRIVE_ID=$DRIVE_ID" >> "$GITHUB_ENV"

      - name: Download Input RBI.xlsx from Zona 11
        run: |
          set -euo pipefail
          FILE_PATH='Zona 11/Asset Register & Verifikasi/Dashboard/Input RBI.xlsx'
          ENCODED_PATH=$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$FILE_PATH")
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/root:/${ENCODED_PATH}:/content" \
            -o 'Input RBI.xlsx'
          test -s 'Input RBI.xlsx' || { echo "Downloaded Excel is empty."; exit 1; }
          ls -lh 'Input RBI.xlsx'

      - name: Generate dashboard database
        run: python sync_database.py

      - name: Commit updated database
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Sync asset database from OneDrive"
            git push
          fi
