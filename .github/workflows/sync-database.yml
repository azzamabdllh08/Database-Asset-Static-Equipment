name: Sync Asset Database from OneDrive Share Link

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-database.yml'
      - 'sync_database.py'
      - 'tools/sync_static.py'
  schedule:
    # Every hour. GitHub Actions cron is UTC.
    - cron: '5 * * * *'

permissions:
  contents: write

env:
  TZ: Asia/Jakarta

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl

      - name: Download source Excel from OneDrive public share link
        env:
          SHARED_URL: 'https://1drv.ms/x/c/8dd2c5d0a467a39a/IQCp0TJlLQVoTbgVteIwn2fFAbSYv35ABYxVGW3GDX5d61c?e=aS7rws'
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          shared_url = os.environ['SHARED_URL']
          output = 'Input RBI.xlsx'

          def validate(path):
              size = os.path.getsize(path) if os.path.exists(path) else 0
              if size < 1000:
                  raise RuntimeError(f'Downloaded file is unexpectedly small: {size} bytes')
              with open(path, 'rb') as f:
                  if f.read(4) != b'PK\x03\x04':
                      raise RuntimeError('Downloaded response is not an XLSX/ZIP file.')
              return size

          def download(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/142 Safari/537.36',
                  'Accept': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*',
              })
              with urllib.request.urlopen(req, timeout=120) as r, open(output, 'wb') as f:
                  while True:
                      chunk = r.read(1024 * 1024)
                      if not chunk:
                          break
                      f.write(chunk)
              return validate(output)

          errors = []

          # Method 1: OneDrive public-share direct download. This avoids the
          # Microsoft Badger endpoint that has been failing in scheduled runs.
          try:
              print('Download method 1: public share ?download=1')
              sep = '&' if '?' in shared_url else '?'
              size = download(shared_url + sep + 'download=1')
              print(f'Downloaded via public share: {size:,} bytes')
              raise SystemExit(0)
          except SystemExit:
              raise
          except Exception as exc:
              errors.append(f'public share: {exc}')
              print(f'Method 1 failed: {exc}')

          # Method 2: OneDrive anonymous shares API. The share URL is encoded
          # as the standard u! base64url identifier; no user login is required
          # for a public share.
          try:
              print('Download method 2: OneDrive anonymous shares API')
              encoded = base64.urlsafe_b64encode(shared_url.encode()).decode().rstrip('=')
              api_url = 'https://api.onedrive.com/v1.0/shares/u!' + encoded + '/root/content'
              size = download(api_url)
              print(f'Downloaded via OneDrive shares API: {size:,} bytes')
              raise SystemExit(0)
          except SystemExit:
              raise
          except Exception as exc:
              errors.append(f'OneDrive shares API: {exc}')
              print(f'Method 2 failed: {exc}')

          # Method 3: Resolve the short 1drv.ms URL first, then request the
          # resolved URL with download=1. This handles redirect changes.
          try:
              print('Download method 3: resolve 1drv.ms redirect')
              opener = urllib.request.build_opener(urllib.request.HTTPRedirectHandler())
              req = urllib.request.Request(shared_url, headers={'User-Agent': 'Mozilla/5.0'})
              with opener.open(req, timeout=60) as r:
                  resolved = r.geturl()
              parsed = urllib.parse.urlsplit(resolved)
              query = urllib.parse.parse_qs(parsed.query, keep_blank_values=True)
              query['download'] = ['1']
              resolved_download = urllib.parse.urlunsplit((parsed.scheme, parsed.netloc, parsed.path, urllib.parse.urlencode(query, doseq=True), parsed.fragment))
              size = download(resolved_download)
              print(f'Downloaded via resolved OneDrive URL: {size:,} bytes')
              raise SystemExit(0)
          except SystemExit:
              raise
          except Exception as exc:
              errors.append(f'resolved URL: {exc}')
              print(f'Method 3 failed: {exc}')

          raise RuntimeError('All OneDrive download methods failed: ' + ' | '.join(errors))
          PY
          ls -lh 'Input RBI.xlsx'

      - name: Generate Static Equipment database
        run: python sync_database.py

      - name: Normalize manifest timestamp as UTC
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path('data/manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          raw = str(data.get('generatedAt', '')).strip()
          if raw:
              dt = datetime.fromisoformat(raw.replace('Z', '+00:00'))
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              data['generatedAt'] = dt.astimezone(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('generatedAt:', data.get('generatedAt'))
          PY

      - name: Write sync heartbeat
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          Path('data/sync-heartbeat.txt').write_text(
              datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z') + '\n',
              encoding='utf-8'
          )
          PY

      - name: Commit updated database
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data/manifest.json data/regions/*.json data/inspections.json data/sync-heartbeat.txt
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Sync Static Equipment database from OneDrive share link"
            git push
          fi
