name: Sync Asset Database from OneDrive Share Link

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-database.yml'
      - 'sync_database.py'
      - 'tools/sync_static.py'
  schedule:
    # Every hour. GitHub Actions cron is UTC.
    - cron: '5 * * * *'

permissions:
  contents: write

env:
  TZ: Asia/Jakarta

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl

      - name: Download source Excel from OneDrive public share link
        env:
          SHARED_URL: 'https://1drv.ms/x/c/8dd2c5d0a467a39a/IQCp0TJlLQVoTbgVteIwn2fFAbSYv35ABYxVGW3GDX5d61c?e=aS7rws'
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          shared_url = os.environ['SHARED_URL']
          output = 'Input RBI.xlsx'

          def validate(path):
              size = os.path.getsize(path) if os.path.exists(path) else 0
              if size < 1000:
                  raise RuntimeError(f'Downloaded file is unexpectedly small: {size} bytes')
              with open(path, 'rb') as f:
                  magic = f.read(4)
              if magic != b'PK\x03\x04':
                  raise RuntimeError('Downloaded response is not a valid XLSX/ZIP file.')
              return size

          def fetch_bytes(url, headers=None, timeout=120):
              request_headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/142 Safari/537.36',
                  'Accept': '*/*',
              }
              if headers:
                  request_headers.update(headers)
              req = urllib.request.Request(url, headers=request_headers)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  data = response.read()
                  content_type = response.headers.get('Content-Type', '')
                  final_url = response.geturl()
              return data, content_type, final_url

          def save_and_validate(data, label):
              with open(output, 'wb') as f:
                  f.write(data)
              size = validate(output)
              print(f'Success: {label} -> {size:,} bytes')

          errors = []

          # 1) Microsoft OneDrive share resolver. This is the preferred path
          # for modern OneDrive share links because it asks Microsoft for the
          # actual temporary content URL instead of scraping the share page.
          try:
              print('Download method 1: Microsoft OneDrive share resolver')
              app_id = '5cbed6ac-a083-4e14-b191-b4ba07653de2'
              token_req = urllib.request.Request(
                  'https://api-badgerp.svc.ms/v1.0/token',
                  data=json.dumps({'appId': app_id}).encode(),
                  headers={
                      'Content-Type': 'application/json',
                      'User-Agent': 'Mozilla/5.0',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(token_req, timeout=30) as response:
                  token_payload = json.load(response)
              badger = token_payload.get('token')
              if not badger:
                  raise RuntimeError('Microsoft Badger token was empty')

              encoded = base64.urlsafe_b64encode(shared_url.encode()).decode().rstrip('=')
              api_url = (
                  'https://my.microsoftpersonalcontent.com/_api/v2.0/shares/u!'
                  + encoded
                  + '/driveitem?$select=id,name,size,file,parentReference,@content.downloadUrl'
              )
              req = urllib.request.Request(
                  api_url,
                  headers={
                      'Authorization': f'Badger {badger}',
                      'Prefer': 'autoredeem',
                      'Accept': 'application/json',
                      'User-Agent': 'Mozilla/5.0',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  item = json.load(response)
              download_url = item.get('@content.downloadUrl')
              if not download_url:
                  raise RuntimeError('OneDrive did not return @content.downloadUrl')
              data, content_type, final_url = fetch_bytes(download_url)
              save_and_validate(data, f'OneDrive resolver ({content_type})')
              raise SystemExit(0)
          except SystemExit:
              raise
          except Exception as exc:
              errors.append(f'OneDrive resolver: {exc}')
              print(f'Method 1 failed: {exc}')

          # 2) Direct public-share download. Works when the share is configured
          # as Anyone with the link and downloading is allowed.
          try:
              print('Download method 2: public share download=1')
              sep = '&' if '?' in shared_url else '?'
              data, content_type, final_url = fetch_bytes(shared_url + sep + 'download=1')
              save_and_validate(data, f'public share ({content_type})')
              raise SystemExit(0)
          except SystemExit:
              raise
          except Exception as exc:
              errors.append(f'public share: {exc}')
              print(f'Method 2 failed: {exc}')

          # 3) Anonymous OneDrive shares API fallback.
          try:
              print('Download method 3: OneDrive anonymous shares API')
              encoded = base64.urlsafe_b64encode(shared_url.encode()).decode().rstrip('=')
              api_url = 'https://api.onedrive.com/v1.0/shares/u!' + encoded + '/root/content'
              data, content_type, final_url = fetch_bytes(api_url)
              save_and_validate(data, f'OneDrive shares API ({content_type})')
              raise SystemExit(0)
          except SystemExit:
              raise
          except Exception as exc:
              errors.append(f'OneDrive shares API: {exc}')
              print(f'Method 3 failed: {exc}')

          # 4) Resolve 1drv.ms and retry the resolved URL with download=1.
          try:
              print('Download method 4: resolve 1drv.ms redirect')
              data, content_type, resolved = fetch_bytes(shared_url)
              parsed = urllib.parse.urlsplit(resolved)
              query = urllib.parse.parse_qs(parsed.query, keep_blank_values=True)
              query['download'] = ['1']
              resolved_download = urllib.parse.urlunsplit((
                  parsed.scheme,
                  parsed.netloc,
                  parsed.path,
                  urllib.parse.urlencode(query, doseq=True),
                  parsed.fragment,
              ))
              data, content_type, final_url = fetch_bytes(resolved_download)
              save_and_validate(data, f'resolved share ({content_type})')
              raise SystemExit(0)
          except SystemExit:
              raise
          except Exception as exc:
              errors.append(f'resolved share: {exc}')
              print(f'Method 4 failed: {exc}')

          raise RuntimeError('All OneDrive download methods failed: ' + ' | '.join(errors))
          PY
          ls -lh 'Input RBI.xlsx'

      - name: Generate Static Equipment database
        run: python sync_database.py

      - name: Normalize manifest timestamp as UTC
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path('data/manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          raw = str(data.get('generatedAt', '')).strip()
          if raw:
              dt = datetime.fromisoformat(raw.replace('Z', '+00:00'))
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              data['generatedAt'] = dt.astimezone(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('generatedAt:', data.get('generatedAt'))
          PY

      - name: Write sync heartbeat
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          Path('data/sync-heartbeat.txt').write_text(
              datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z') + '\n',
              encoding='utf-8'
          )
          PY

      - name: Commit updated database
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data/manifest.json data/regions/*.json data/inspections.json data/sync-heartbeat.txt
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Sync Static Equipment database from OneDrive share link"
            git push
          fi
